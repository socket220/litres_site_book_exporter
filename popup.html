<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>litres book exporter</title><link rel="stylesheet" href="popup.css"></head><body>
<h1>litres book exporter</h1><p class="muted" data-i18n="subtitle"></p>
<p id="title" data-i18n="openBook"></p><p id="state" role="status" aria-live="polite" data-i18n="connecting"></p>
<label><input id="fromStart" type="checkbox" checked> <span data-i18n="fromStart"></span></label>
<label class="speed-label"><span data-i18n="speed"></span><select id="speed"><option value="fast" data-i18n="fast"></option><option value="normal" selected data-i18n="normal"></option><option value="careful" data-i18n="careful"></option></select></label>
<button id="auto" disabled data-i18n="auto"></button><div class="buttons"><button id="start" disabled data-i18n="manual"></button><button id="stop" disabled data-i18n="pause"></button></div>
<p data-i18n="help"></p><div id="stats"></div><details><summary data-i18n="report"></summary><div id="details"></div></details>
<p class="warning" data-i18n="warning"></p><label><input id="ack" type="checkbox"> <span data-i18n="ack"></span></label>
<button id="editMetadata" disabled data-i18n="metadata"></button>
<label class="speed-label"><span data-i18n="format"></span><select id="format"><option value="epub">EPUB</option><option value="fb2">FB2</option><option value="pdf">PDF</option></select></label>
<p id="pdfHelp" hidden data-i18n="pdfHelp"></p><button id="export" disabled data-i18n="export"></button><p id="error" role="alert"></p>
<script src="i18n.js"></script><script src="popup.js"></script></body></html>
